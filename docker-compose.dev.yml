services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vclk
      POSTGRES_USER: vclk
      POSTGRES_PASSWORD: vclk-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      - redis
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7888:7888/tcp"
      - "7882:7882/tcp"
      - "51000-51100:51000-51100/udp"

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit-egress/config.yaml
    volumes:
      - ./egress.dev.yaml:/etc/livekit-egress/config.yaml:ro
      - ${RECORDINGS_HOST_PATH:-./recordings}:/out

  server:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./server/.env
    environment:
      PORT: 3101
      LIVEKIT_URL: ws://livekit:7888
      LIVEKIT_HTTP_URL: http://livekit:7888
      RECORDING_OUTPUT_PREFIX: /out
      ATTACHMENTS_DIR: /attachments
      DATABASE_URL: postgres://vclk:vclk-dev-password@postgres:5432/vclk
      PUBLIC_BASE_URL: https://localhost:5173
    command: >
      sh -c "npm install && npm run dev"
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - ${RECORDINGS_HOST_PATH:-./recordings}:/out
      - ${ATTACHMENTS_HOST_PATH:-./attachments}:/attachments
    ports:
      - "3101:3101"
    depends_on:
      - postgres
      - livekit
      - egress

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_BACKEND_TARGET: http://server:3101
      VITE_LIVEKIT_SIGNALING_TARGET: ws://livekit:7888
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server
      - livekit

volumes:
  postgres-dev-data:
  redis-dev-data:
  server-node-modules:
  web-node-modules:
