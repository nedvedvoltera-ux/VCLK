services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      - redis
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./livekit.prod.yaml}:/etc/livekit/livekit.yaml:ro
    ports:
      - "7888:7888/tcp"
      - "7882:7882/tcp"
      - "50000-50100:50000-50100/udp"
      # TURN ports (3478/udp, 5349/tcp, 30000-40000/udp) — add when using livekit.prod.turn.yaml

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit-egress/config.yaml
    volumes:
      - ./egress.prod.yaml:/etc/livekit-egress/config.yaml:ro
      - ${RECORDINGS_HOST_PATH:-./recordings}:/out

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 3101
      LIVEKIT_URL: ws://livekit:7888
      LIVEKIT_HTTP_URL: http://livekit:7888
      RECORDING_OUTPUT_PREFIX: /out
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASR_QUEUE_KEY: ${ASR_QUEUE_KEY:-transcription:jobs}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
    volumes:
      - ${RECORDINGS_HOST_PATH:-./recordings}:/out
    depends_on:
      - livekit
      - egress
      - redis

  asr-worker:
    build:
      context: ./asr
    restart: unless-stopped
    environment:
      RECORDINGS_DIR: /out
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASR_QUEUE_KEY: ${ASR_QUEUE_KEY:-transcription:jobs}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      SUMMARY_ENABLED: ${SUMMARY_ENABLED:-true}
      SUMMARY_API_BASE_URL: ${SUMMARY_API_BASE_URL:-http://192.168.215.74:9080/v1}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-Qwen/Qwen3.5-35B-A3B-FP8}
      SUMMARY_TIMEOUT_SEC: ${SUMMARY_TIMEOUT_SEC:-180}
      SUMMARY_MAX_TOKENS: ${SUMMARY_MAX_TOKENS:-512}
      SUMMARY_TEMPERATURE: ${SUMMARY_TEMPERATURE:-0.0}
    volumes:
      - ${RECORDINGS_HOST_PATH:-./recordings}:/out
    depends_on:
      - redis

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      TLS_IP: ${TLS_IP:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-_}
      HTTPS_PUBLIC_PORT: ${WEB_HTTPS_PORT:-8443}
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs/custom:ro
    depends_on:
      - server
      - livekit
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"

volumes:
  redis-data:
